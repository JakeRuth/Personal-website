<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jake Ruth Setup Wizard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Faux desktop background behind the wizard -->
<div class="desktop" aria-hidden="true">
  <div class="desktop-icons">
    <div class="dicon">
      <div class="dicon-img folder"></div>
      <div class="dicon-label">My Career</div>
    </div>
    <div class="dicon">
      <div class="dicon-img folder"></div>
      <div class="dicon-label">Projects</div>
    </div>
    <div class="dicon">
      <div class="dicon-img doc"></div>
      <div class="dicon-label">resume.pdf</div>
    </div>
    <div class="dicon">
      <div class="dicon-img cube"></div>
      <div class="dicon-label">rubiks.exe</div>
    </div>
  </div>

  <div class="taskbar">
    <button class="start" tabindex="-1">
      <span class="start-flag"></span><span>Start</span>
    </button>
    <div class="taskbar-app">
      <span class="tb-icon"></span> Jake Ruth Setup Wizard
    </div>
    <div class="tray">
      <span class="tray-icon" title="Cube drivers registered">CUBE</span>
      <span class="clock" id="clock">12:00 PM</span>
    </div>
  </div>
</div>

<!-- The wizard window -->
<div class="window" id="wizard" role="dialog" aria-label="Jake Ruth Setup Wizard">
  <div class="titlebar">
    <span class="title-icon"></span>
    <span class="title-text">Jake Ruth Setup Wizard</span>
    <div class="title-buttons">
      <button class="tb-btn" aria-label="Minimize" tabindex="-1">_</button>
      <button class="tb-btn" aria-label="Maximize" tabindex="-1">&#9633;</button>
      <button class="tb-btn close" aria-label="Close" id="tb-close">&times;</button>
    </div>
  </div>

  <div class="body" id="wizard-body">
    <!-- Step content injected here -->
  </div>

  <div class="footer">
    <div class="footer-left">
      <span id="footer-hint">Step <span id="step-num">1</span> of 4</span>
    </div>
    <div class="footer-right">
      <button class="btn" id="btn-back" disabled>&lt; Back</button>
      <button class="btn primary" id="btn-next">Next &gt;</button>
      <span class="btn-gap"></span>
      <button class="btn" id="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

<!-- Cancel confirmation dialog -->
<div class="modal" id="modal-cancel" hidden>
  <div class="window modal-window">
    <div class="titlebar plain">
      <span class="title-text">Jake Ruth Setup</span>
      <div class="title-buttons">
        <button class="tb-btn close" data-close-modal="modal-cancel" aria-label="Close">&times;</button>
      </div>
    </div>
    <div class="body modal-body">
      <div class="modal-row">
        <div class="modal-icon warn"></div>
        <div>
          <p><strong>Are you sure you want to cancel Jake Ruth Setup?</strong></p>
          <p class="dim">If you cancel now, Jake will not be installed. You can still reach him at <a href="mailto:jake@stockunlock.com">jake@stockunlock.com</a>.</p>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="footer-left"></div>
      <div class="footer-right">
        <button class="btn" id="cancel-yes">Yes</button>
        <button class="btn primary" data-close-modal="modal-cancel">No</button>
      </div>
    </div>
  </div>
</div>

<script src="wizard.js"></script>
</body>
</html>
