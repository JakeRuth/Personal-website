<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>jake-ruth --help</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="phosphor" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="terminal" id="terminal" aria-label="Terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">jake@ruth ~ — zsh</span>
    </div>

    <div class="screen" id="screen" tabindex="0">
      <div id="output" class="output" aria-live="polite"></div>
      <div class="input-line" id="inputLine" hidden>
        <span class="prompt">$</span>
        <span class="input-wrap">
          <span id="inputText" class="input-text"></span><span id="caret" class="caret">&nbsp;</span><span id="ghost" class="ghost"></span>
        </span>
      </div>
      <input id="hiddenInput" class="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal input" />
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
