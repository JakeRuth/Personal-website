<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jake Ruth — The Ruth Transit Authority</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="bullet"></div>
    <div class="brand-text">
      <div class="authority">RUTH TRANSIT AUTHORITY</div>
      <div class="subline">System Map &middot; 2026 Edition &middot; Service to all chapters</div>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" class="search-ic" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="text" placeholder="try: Oscar &middot; Rubik's &middot; AI &middot; Daniel" autocomplete="off" />
    <button id="clear-search" aria-label="clear">&times;</button>
  </div>
  <div class="meta">
    <a class="mail" href="mailto:jake@stockunlock.com">jake@stockunlock.com</a>
  </div>
</header>

<main class="map-stage">
  <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Subway map of Jake Ruth's life">
    <defs>
      <pattern id="paper" patternUnits="userSpaceOnUse" width="200" height="200">
        <rect width="200" height="200" fill="#F5F2EA"/>
        <circle cx="30" cy="50" r="0.5" fill="#00000008"/>
        <circle cx="110" cy="130" r="0.5" fill="#00000008"/>
        <circle cx="170" cy="70" r="0.5" fill="#00000008"/>
      </pattern>

      <filter id="stationShadow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
        <feOffset dx="0" dy="1" result="off"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <rect width="1600" height="1000" fill="url(#paper)"/>

    <!-- Compass rose -->
    <g transform="translate(1480,140)" class="compass" opacity="0.85">
      <circle r="34" fill="none" stroke="#1b2838" stroke-width="1.2"/>
      <circle r="26" fill="none" stroke="#1b2838" stroke-width="0.6"/>
      <path d="M0,-30 L6,0 L0,30 L-6,0 Z" fill="#1b2838"/>
      <path d="M-30,0 L0,-6 L30,0 L0,6 Z" fill="#1b2838" opacity="0.35"/>
      <text y="-42" text-anchor="middle" font-size="10" font-weight="700" fill="#1b2838" letter-spacing="2">N</text>
      <text y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#1b2838" letter-spacing="2">S</text>
    </g>

    <!-- Title block -->
    <g transform="translate(480,70)" class="titleblock">
      <text x="0" y="0" class="title-sub" font-size="11" letter-spacing="4" fill="#1b2838" text-anchor="middle">SHEET 01 OF 01 &middot; REV. 2026.04 &middot; RUTH TRANSIT AUTHORITY</text>
      <text x="0" y="42" class="title-main" font-size="40" font-weight="900" fill="#0F1E36" letter-spacing="-1" text-anchor="middle">THE JAKE RUTH SYSTEM MAP</text>
      <text x="0" y="68" class="title-desc" font-size="12" fill="#1b2838" text-anchor="middle" letter-spacing="2">CAREER &middot; EDUCATION &middot; HOBBIES &middot; PROJECTS &middot; PEOPLE &middot; TOOLS &middot; IDENTITY</text>
    </g>

    <!-- WATER / PARK feature for geographic flavor -->
    <g class="water" opacity="0.9" pointer-events="none">
      <path d="M 1100,820 Q 1180,760 1280,780 Q 1380,800 1440,760 Q 1500,720 1560,740 L 1560,990 L 1040,990 Z"
            fill="#D9E6ED" stroke="#B6CBD6" stroke-width="1"/>
      <text x="1300" y="920" font-size="16" letter-spacing="6" fill="#6A8696" font-weight="700">HUDSON BAY</text>
    </g>
    <g class="park" opacity="0.85" pointer-events="none">
      <path d="M 80,820 Q 140,780 220,800 Q 300,820 340,800 L 340,990 L 60,990 Z"
            fill="#E2E8D4" stroke="#C3CFA8" stroke-width="1"/>
      <text x="180" y="910" font-size="14" letter-spacing="5" fill="#6F7E48" font-weight="700">WESTCHESTER PARK</text>
    </g>

    <!-- LINES (paths drawn before stations so stations sit on top) -->
    <g id="lines"></g>
    <!-- STATIONS -->
    <g id="stations"></g>
    <!-- LABELS -->
    <g id="labels"></g>

    <!-- Legend -->
    <g id="legend" transform="translate(60,820)"></g>

    <!-- Scale bar -->
    <g transform="translate(1300,960)" class="scalebar" pointer-events="none">
      <rect x="0" y="0" width="40" height="6" fill="#0F1E36"/>
      <rect x="40" y="0" width="40" height="6" fill="#F5F2EA" stroke="#0F1E36" stroke-width="1"/>
      <rect x="80" y="0" width="40" height="6" fill="#0F1E36"/>
      <text x="0" y="22" font-size="10" fill="#0F1E36" font-weight="600" letter-spacing="1">0</text>
      <text x="60" y="22" font-size="10" fill="#0F1E36" font-weight="600" letter-spacing="1" text-anchor="middle">~6 YRS</text>
      <text x="120" y="22" font-size="10" fill="#0F1E36" font-weight="600" letter-spacing="1" text-anchor="end">~13 YRS</text>
    </g>
  </svg>

  <!-- Tooltip -->
  <div id="tip" class="tip" hidden></div>

  <!-- Side panel -->
  <aside id="panel" class="panel" aria-hidden="true">
    <button id="panel-close" aria-label="close">&times;</button>
    <div id="panel-body"></div>
  </aside>
</main>

<footer class="footbar">
  <div>DO NOT ENTER TRACKS &middot; PLEASE STAND CLEAR OF THE CLOSING DECADE</div>
  <div>&copy; 2026 Jake Ruth &middot; This map is schematic; geography is not to scale.</div>
</footer>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
