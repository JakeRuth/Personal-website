<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jake Ruth — Explorable World</title>
    <style>
      :root {
        --sky-0: #07091a;
        --sky-1: #0d1230;
        --sky-2: #141a45;
        --ink: #e8ecff;
        --ink-dim: #9aa3d4;
        --neon-pink: #ff5ed2;
        --neon-cyan: #5ef3ff;
        --neon-gold: #ffd35e;
        --neon-green: #7aff9e;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: radial-gradient(ellipse at 50% 20%, #1a1f55 0%, #07091a 65%, #030410 100%);
        color: var(--ink);
        font-family: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
        min-height: 100vh;
        overflow: hidden;
      }
      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
      }
      .title {
        letter-spacing: 0.25em;
        text-transform: uppercase;
        font-size: 11px;
        color: var(--ink-dim);
      }
      .title b { color: var(--neon-cyan); font-weight: 600; }
      .frame {
        position: relative;
        width: min(92vw, 880px);
        aspect-ratio: 4/3;
        border-radius: 10px;
        border: 1px solid #2a2f68;
        box-shadow:
          0 0 0 1px rgba(94, 243, 255, 0.08),
          0 30px 80px rgba(0,0,0,0.6),
          inset 0 0 60px rgba(94, 243, 255, 0.04);
        overflow: hidden;
        background: #05061a;
      }
      canvas#game {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .hud {
        position: absolute;
        left: 12px; top: 12px;
        padding: 6px 10px;
        background: rgba(7,9,26,0.6);
        border: 1px solid #2a2f68;
        border-radius: 6px;
        font-size: 11px;
        color: var(--ink-dim);
        backdrop-filter: blur(4px);
      }
      .hud kbd {
        font-family: inherit;
        background: #1a2060;
        color: var(--neon-cyan);
        padding: 1px 5px;
        border-radius: 3px;
        border: 1px solid #2a2f68;
        font-size: 10px;
      }
      .minimap-wrap {
        position: absolute;
        right: 12px; top: 12px;
        padding: 6px;
        background: rgba(7,9,26,0.7);
        border: 1px solid #2a2f68;
        border-radius: 6px;
        backdrop-filter: blur(4px);
      }
      .minimap-wrap .label {
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--ink-dim);
        margin-bottom: 4px;
        text-align: center;
        text-transform: uppercase;
      }
      canvas#minimap {
        display: block;
        width: 140px; height: 105px;
        image-rendering: pixelated;
        background: #05061a;
        border-radius: 3px;
      }
      .tooltip {
        position: absolute;
        pointer-events: none;
        padding: 6px 10px;
        background: rgba(7,9,26,0.92);
        border: 1px solid var(--neon-cyan);
        border-radius: 6px;
        color: var(--ink);
        font-size: 12px;
        transform: translate(-50%, -100%);
        white-space: nowrap;
        box-shadow: 0 0 18px rgba(94,243,255,0.25);
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      .tooltip.show { opacity: 1; }
      .tooltip .t-name { color: var(--neon-cyan); font-weight: 600; }
      .tooltip .t-blurb { display: block; color: var(--ink-dim); font-size: 10px; margin-top: 2px; }
      .tooltip .t-hint  { display: block; color: var(--neon-gold); font-size: 10px; margin-top: 4px; letter-spacing: 0.1em; }
      .modal-scrim {
        position: absolute;
        inset: 0;
        background: rgba(3,4,16,0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        backdrop-filter: blur(3px);
        z-index: 10;
      }
      .modal-scrim.show { display: flex; }
      .modal {
        position: relative;
        max-width: 520px;
        width: 100%;
        background: linear-gradient(180deg, #10153a 0%, #070a22 100%);
        border: 1px solid var(--neon-cyan);
        border-radius: 10px;
        padding: 22px 24px;
        box-shadow: 0 0 40px rgba(94,243,255,0.25);
        animation: pop 0.22s ease;
      }
      @keyframes pop {
        from { transform: translateY(8px) scale(0.98); opacity: 0; }
        to   { transform: none; opacity: 1; }
      }
      .modal h2 {
        margin: 0 0 2px;
        color: var(--neon-cyan);
        font-size: 18px;
        letter-spacing: 0.08em;
      }
      .modal .era {
        font-size: 10px;
        color: var(--neon-gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .modal p {
        color: var(--ink);
        font-size: 13px;
        line-height: 1.55;
        margin: 0 0 10px;
      }
      .modal .close {
        position: absolute;
        top: 8px; right: 10px;
        background: transparent;
        color: var(--ink-dim);
        border: 0;
        cursor: pointer;
        font-size: 16px;
        font-family: inherit;
      }
      .modal .close:hover { color: var(--neon-pink); }
      .modal .footer {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--ink-dim);
        letter-spacing: 0.15em;
      }
      .modal .footer a { color: var(--neon-cyan); text-decoration: none; }
      .modal .footer a:hover { text-decoration: underline; }
      .scanlines {
        position: absolute; inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: overlay;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="title">Jake Ruth <b>&middot; Explorable World</b> &middot; Concept 08</div>
      <div class="frame">
        <canvas id="game" width="800" height="600"></canvas>
        <div class="scanlines"></div>
        <div class="hud">
          Move <kbd>WASD</kbd> / <kbd>Arrows</kbd> &nbsp; Interact <kbd>E</kbd> / <kbd>Space</kbd> &nbsp; Close <kbd>Esc</kbd>
        </div>
        <div class="minimap-wrap">
          <div class="label">Map</div>
          <canvas id="minimap" width="140" height="105"></canvas>
        </div>
        <div id="tooltip" class="tooltip"></div>
        <div id="modalScrim" class="modal-scrim">
          <div class="modal" role="dialog" aria-modal="true">
            <button class="close" id="modalClose" aria-label="Close">&times;</button>
            <div class="era" id="modalEra"></div>
            <h2 id="modalTitle"></h2>
            <div id="modalBody"></div>
            <div class="footer">
              <span>Press <kbd style="font-family:inherit;">Esc</kbd> to close</span>
              <a href="mailto:jake@stockunlock.com">jake@stockunlock.com</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
