<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jakeOS — Jake Ruth</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Wallpaper layer -->
  <canvas id="wallpaper"></canvas>

  <!-- Desktop -->
  <main id="desktop" aria-label="Desktop">

    <!-- Menu bar (top) -->
    <header class="menubar">
      <div class="menubar-left">
        <span class="menu-logo">jakeOS</span>
        <span class="menu-item">File</span>
        <span class="menu-item">View</span>
        <span class="menu-item">Window</span>
        <span class="menu-item">Help</span>
      </div>
      <div class="menubar-right">
        <span id="menu-date"></span>
        <span id="menu-time"></span>
      </div>
    </header>

    <!-- Desktop icons -->
    <section class="icon-grid" id="icon-grid" aria-label="Desktop icons">
      <button class="icon" data-app="about">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        </span>
        <span class="icon-label">About.app</span>
      </button>

      <button class="icon" data-app="projects">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 4v5"/></svg>
        </span>
        <span class="icon-label">Projects.app</span>
      </button>

      <button class="icon" data-app="resume">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 13h5M10 17h5M10 9h2"/></svg>
        </span>
        <span class="icon-label">Resume.pdf</span>
      </button>

      <button class="icon" data-app="contact">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 7 9-7"/></svg>
        </span>
        <span class="icon-label">Contact.app</span>
      </button>

      <button class="icon" data-app="stockunlock">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 17l4-6 4 3 4-8 4 5"/><path d="M4 21h16"/></svg>
        </span>
        <span class="icon-label">StockUnlock.app</span>
      </button>

      <button class="icon" data-app="cube">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 2v10M21 7l-9 5-9-5"/></svg>
        </span>
        <span class="icon-label">RubiksCube.app</span>
      </button>

      <button class="icon" data-app="notepad">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
        </span>
        <span class="icon-label">Notepad.txt</span>
      </button>

      <button class="icon" data-app="terminal">
        <span class="icon-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        </span>
        <span class="icon-label">Terminal.app</span>
      </button>
    </section>

    <!-- Window host -->
    <div id="windows"></div>

    <!-- Start menu -->
    <nav id="startmenu" class="hidden" aria-label="Start menu">
      <div class="start-header">
        <div class="start-avatar">JR</div>
        <div>
          <div class="start-name">Jake Ruth</div>
          <div class="start-sub">jake@stockunlock.com</div>
        </div>
      </div>
      <ul class="start-list">
        <li data-app="about">About me</li>
        <li data-app="projects">What I've built</li>
        <li data-app="resume">Resume (PDF)</li>
        <li data-app="contact">Get in touch</li>
        <li data-app="stockunlock">Stock Unlock</li>
        <li data-app="terminal">Terminal</li>
      </ul>
      <div class="start-footer">
        <span>jakeOS v0.3 — prototype</span>
      </div>
    </nav>

    <!-- Taskbar (bottom) -->
    <footer class="taskbar">
      <button id="start-btn" class="start-btn" aria-label="Open start menu">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg>
        <span>Start</span>
      </button>
      <div class="taskbar-pills" id="taskbar-pills"></div>
      <div class="tray">
        <span class="tray-item" title="Network">
          <svg viewBox="0 0 24 24"><path d="M2 10a15 15 0 0 1 20 0M5 14a10 10 0 0 1 14 0M8.5 17.5a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1" fill="currentColor"/></svg>
        </span>
        <span class="tray-item" title="Battery">
          <svg viewBox="0 0 24 24"><rect x="3" y="8" width="16" height="10" rx="1"/><rect x="5" y="10" width="10" height="6" fill="currentColor"/><path d="M20 11v4"/></svg>
        </span>
        <span class="tray-clock" id="tray-clock"></span>
      </div>
    </footer>

  </main>

<script src="app.js"></script>
</body>
</html>
