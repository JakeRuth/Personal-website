<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jake Ruth — choose an experience</title>
<style>
  :root {
    --ink: #f5f3ee;
    --dim: #7c776d;
    --hair: rgba(245, 243, 238, 0.12);
    --hair-hot: rgba(245, 243, 238, 0.85);
    --accent: #e9c46a;
    --bg: #0a0a0a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
    font-weight: 300;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    padding: clamp(18px, 3.2vh, 36px) clamp(20px, 5vw, 64px);
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    opacity: 0;
    animation: fadeIn 600ms ease 60ms forwards;
  }
  .mark {
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 500;
  }
  .mark .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 10px;
    vertical-align: middle;
  }
  .meta {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ---- Main stage ---- */
  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 0;
  }
  .intro {
    margin-bottom: clamp(20px, 4vh, 44px);
    opacity: 0;
    animation: fadeIn 700ms ease 180ms forwards;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .lede {
    font-size: clamp(22px, 3.4vw, 34px);
    line-height: 1.25;
    font-weight: 300;
    margin: 0;
    max-width: 22ch;
    letter-spacing: -0.015em;
  }
  .lede em {
    font-style: normal;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
  }

  /* ---- The five ---- */
  .list {
    border-top: 1px solid var(--hair);
    opacity: 0;
    animation: fadeIn 700ms ease 280ms forwards;
  }
  .row {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: clamp(14px, 2.4vw, 28px);
    padding: clamp(14px, 2.4vh, 22px) 4px;
    border-bottom: 1px solid var(--hair);
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    transition: padding-left 220ms ease, background-color 220ms ease, border-color 220ms ease;
    position: relative;
  }
  .row::before {
    content: "";
    position: absolute;
    left: 0; top: 50%;
    width: 0;
    height: 1px;
    background: var(--accent);
    transform: translateY(-50%);
    transition: width 240ms ease;
  }
  .row:hover,
  .row:focus-visible {
    padding-left: 18px;
    outline: none;
  }
  .row:hover::before,
  .row:focus-visible::before {
    width: 10px;
  }
  .row:hover .num,
  .row:focus-visible .num { color: var(--accent); }
  .row:hover .label,
  .row:focus-visible .label { color: var(--ink); }
  .row:hover .chev,
  .row:focus-visible .chev {
    color: var(--accent);
    transform: translateX(6px);
  }

  .num {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    transition: color 220ms ease;
  }
  .body { min-width: 0; }
  .label {
    font-size: clamp(26px, 3.4vw, 40px);
    line-height: 1.1;
    font-weight: 300;
    letter-spacing: -0.015em;
    margin: 0;
  }
  .desc {
    font-size: clamp(13px, 1.1vw, 14px);
    color: var(--dim);
    margin: 6px 0 0;
    letter-spacing: 0;
    line-height: 1.45;
    font-weight: 300;
  }
  .chev {
    font-size: 18px;
    color: var(--dim);
    transition: transform 220ms ease, color 220ms ease;
    font-weight: 300;
  }

  /* ---- Footer ---- */
  footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #3f3b34;
    opacity: 0;
    animation: fadeIn 700ms ease 460ms forwards;
  }
  footer .hint { color: var(--dim); text-transform: none; letter-spacing: 0.02em; }
  footer .hint kbd {
    font-family: "SFMono-Regular", ui-monospace, Menlo, monospace;
    font-size: 10px;
    padding: 2px 6px;
    border: 1px solid var(--hair);
    border-radius: 4px;
    color: var(--ink);
    margin: 0 2px;
    letter-spacing: 0;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  .fade-out { animation: fadeOut 360ms ease forwards; }
  @keyframes fadeOut { to { opacity: 0; transform: translateY(-4px); } }

  /* ---- Tighter screens: keep everything in one viewport ---- */
  @media (max-height: 720px) {
    .label { font-size: clamp(22px, 3vw, 30px); }
    .row { padding: 14px 4px; }
    .lede { font-size: clamp(20px, 2.6vw, 26px); }
  }
  @media (max-width: 600px) {
    body { padding: 18px 20px; }
    header .meta { display: none; }
    .row { grid-template-columns: 32px 1fr auto; gap: 14px; }
    .label { font-size: 22px; }
    .desc { font-size: 13px; }
    footer .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="mark"><span class="dot"></span>Jake Ruth</div>
  <div class="meta">Choose an experience</div>
</header>

<main>
  <section class="intro">
    <div class="kicker">Five ways to read the same person</div>
    <h1 class="lede">Same content, five <em>rooms</em>. Pick one.</h1>
  </section>

  <nav class="list" id="list" aria-label="Experiences">
    <!-- Rows injected by JS so the catalog lives in one place. -->
  </nav>
</main>

<footer>
  <div class="stamp">picker-auto-v2 / prototype</div>
  <div class="hint">
    <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> to jump &nbsp;·&nbsp; <kbd>↑</kbd><kbd>↓</kbd> then <kbd>↵</kbd>
  </div>
</footer>

<script>
  // ---- Catalog: name, slug, Jake-voice one-liner ----
  const EXPERIENCES = [
    {
      slug: "xp-luna-v2",
      label: "XP Luna",
      desc: "Windows XP, warmed over. Teal task bar, Bliss wallpaper, real content underneath."
    },
    {
      slug: "vista-faithful-v3",
      label: "Vista Faithful",
      desc: "Glass, Aero, maximum chrome. Everything 2007 promised and then apologized for."
    },
    {
      slug: "enterprise-saas-v2",
      label: "Enterprise SaaS",
      desc: "The parody pitch. Pricing cards, logos, CTA stack. I am not actually for sale."
    },
    {
      slug: "readme-git-fusion",
      label: "README x Git",
      desc: "Markdown resume plus a scrollable commit log. Engineer-native."
    },
    {
      slug: "readme-mode",
      label: "README",
      desc: "Plain text. Zero chrome. The version you'd paste into a terminal."
    }
  ];

  // ---- Render rows ----
  const list = document.getElementById("list");
  EXPERIENCES.forEach((exp, i) => {
    const a = document.createElement("a");
    a.href = "../" + exp.slug + "/";
    a.className = "row";
    a.setAttribute("data-slug", exp.slug);
    a.setAttribute("data-index", String(i));
    a.innerHTML = `
      <span class="num">0${i + 1}</span>
      <span class="body">
        <p class="label">${exp.label}</p>
        <p class="desc">${exp.desc}</p>
      </span>
      <span class="chev" aria-hidden="true">&rsaquo;</span>
    `;
    a.addEventListener("click", (e) => {
      e.preventDefault();
      launch(exp.slug);
    });
    list.appendChild(a);
  });

  function launch(slug) {
    document.body.classList.add("fade-out");
    setTimeout(() => { window.location.href = "../" + slug + "/"; }, 340);
  }

  // ---- Keyboard: 1-5, arrow nav, Enter ----
  const rows = Array.from(document.querySelectorAll(".row"));
  let focused = -1;

  document.addEventListener("keydown", (e) => {
    // Number keys 1-5
    if (/^[1-5]$/.test(e.key)) {
      const idx = parseInt(e.key, 10) - 1;
      if (EXPERIENCES[idx]) {
        e.preventDefault();
        launch(EXPERIENCES[idx].slug);
      }
      return;
    }
    if (e.key === "ArrowDown" || e.key === "j") {
      e.preventDefault();
      focused = (focused + 1) % rows.length;
      rows[focused].focus();
      return;
    }
    if (e.key === "ArrowUp" || e.key === "k") {
      e.preventDefault();
      focused = (focused - 1 + rows.length) % rows.length;
      rows[focused].focus();
      return;
    }
    if (e.key === "Enter" && document.activeElement && document.activeElement.classList.contains("row")) {
      e.preventDefault();
      const slug = document.activeElement.getAttribute("data-slug");
      if (slug) launch(slug);
    }
  });
</script>

</body>
</html>
