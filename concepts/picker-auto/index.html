<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jake Ruth — picking an experience</title>
<style>
  :root {
    --ink: #f5f3ee;
    --dim: #8c877d;
    --accent: #e9c46a;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0a0a0a;
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", system-ui, -apple-system, sans-serif;
    font-weight: 300;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .stage {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    animation: fadeIn 600ms ease forwards;
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: left;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 28px;
  }
  .kicker .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 10px;
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .line {
    font-size: clamp(22px, 3.6vw, 32px);
    line-height: 1.35;
    font-weight: 300;
    margin: 0 0 18px;
    min-height: 1.35em;
  }
  .line.muted { color: var(--dim); }
  .line .picked {
    font-weight: 500;
    color: var(--ink);
    border-bottom: 1px solid var(--accent);
    padding-bottom: 2px;
  }
  .line .reason {
    font-size: 14px;
    color: var(--dim);
    display: block;
    margin-top: 10px;
    font-weight: 300;
    letter-spacing: 0;
  }
  .actions {
    margin-top: 36px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  button, .link {
    background: none;
    border: 1px solid #2a2a2a;
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: border-color 120ms ease, color 120ms ease;
  }
  button:hover, .link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.primary {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.primary:hover { background: rgba(233, 196, 106, 0.08); }
  .switch-dropdown {
    display: none;
    margin-top: 20px;
    border: 1px solid #222;
    border-radius: 10px;
    overflow: hidden;
  }
  .switch-dropdown.open { display: block; }
  .switch-dropdown button {
    width: 100%;
    text-align: left;
    border: none;
    border-bottom: 1px solid #1a1a1a;
    border-radius: 0;
    padding: 14px 18px;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
  }
  .switch-dropdown button:last-child { border-bottom: none; }
  .switch-dropdown button:hover {
    background: #141414;
    color: var(--accent);
  }
  .switch-dropdown .slug {
    color: var(--dim);
    font-size: 11px;
    margin-left: 8px;
    letter-spacing: 0.1em;
  }
  .countdown {
    margin-top: 28px;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.08em;
  }
  .countdown .bar {
    display: block;
    height: 1px;
    background: #1a1a1a;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
  }
  .countdown .bar::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    animation: fill var(--dur, 2400ms) linear forwards;
  }
  .foot {
    position: fixed;
    bottom: 20px;
    left: 24px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #3a3a3a;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }
  @keyframes fill { to { width: 100%; } }
  .fade-out { animation: fadeOut 400ms ease forwards; }
  @keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="card">
    <div class="kicker"><span class="dot"></span> Jake Ruth</div>
    <p class="line muted" id="line1">Picking an experience for you...</p>
    <p class="line" id="line2" style="visibility: hidden;">
      Chose: <span class="picked" id="picked">Enterprise SaaS</span>.
      <span class="reason" id="reason"></span>
    </p>
    <div class="actions" id="actions" style="visibility: hidden;">
      <button class="primary" id="goBtn">Take me there</button>
      <button id="switchBtn">Not right? Switch</button>
      <button id="stayBtn" title="Stay on this screen">Hold up</button>
    </div>
    <div class="switch-dropdown" id="dropdown"></div>
    <div class="countdown" id="countdown" style="visibility: hidden;">
      Auto-launching in <span id="secs">3</span>s
      <span class="bar"></span>
    </div>
  </div>
</div>
<div class="foot">picker-auto / prototype 07</div>

<script>
// ---- Experience catalog ----
const EXPERIENCES = [
  { slug: "xp-luna-v2",         label: "XP Luna",          hint: "warm, Windows XP nostalgia" },
  { slug: "enterprise-saas-v2", label: "Enterprise SaaS",  hint: "buy-mode, the parody pitch" },
  { slug: "git-log-v2",         label: "Git Log",          hint: "engineer-native, terminal timeline" },
  { slug: "readme-mode",        label: "README",           hint: "the plain-text resume" },
  { slug: "vista-faithful-v2",  label: "Vista Faithful",   hint: "glass, Aero, maximal chrome" },
];

// ---- Auto-selection logic ----
// Combines (1) explicit stored override, (2) time of day, (3) device width, (4) referrer nudge.
function pick() {
  // 1. Explicit remembered choice always wins.
  const remembered = localStorage.getItem("jr_experience_locked");
  if (remembered && EXPERIENCES.find(e => e.slug === remembered)) {
    return { slug: remembered, reason: "You told me last time to remember this one." };
  }

  const hour = new Date().getHours();
  const mobile = window.matchMedia("(max-width: 640px)").matches;
  const ref = (document.referrer || "").toLowerCase();

  // 2. Mobile — README wins (most readable on small screens).
  if (mobile) {
    return { slug: "readme-mode", reason: "You're on mobile. README reads best on small screens." };
  }

  // 3. Referrer nudge.
  if (ref.includes("github")) {
    return { slug: "git-log-v2", reason: "You came from GitHub. Seems like a Git Log kind of visit." };
  }
  if (ref.includes("linkedin")) {
    return { slug: "readme-mode", reason: "LinkedIn referral. Starting with the plain-text version." };
  }

  // 4. Time of day.
  if (hour >= 5 && hour < 12) {
    return { slug: "git-log-v2", reason: "It's morning. Engineers tend to read timelines before coffee." };
  }
  if (hour >= 12 && hour < 17) {
    return { slug: "enterprise-saas-v2", reason: "Mid-afternoon. Buy-mode feels right." };
  }
  if (hour >= 17 && hour < 21) {
    return { slug: "xp-luna-v2", reason: "Evening. Pouring you a warm one — XP Luna." };
  }
  return { slug: "vista-faithful-v2", reason: "Night owl. Vista glass suits the hour." };
}

// ---- Stage ----
const AUTO_LAUNCH_MS = 3200;
const stage = document.getElementById("stage");
const picked = pick();
const pickedExp = EXPERIENCES.find(e => e.slug === picked.slug);

document.getElementById("picked").textContent = pickedExp.label;
document.getElementById("reason").textContent = picked.reason;

// Reveal sequence
setTimeout(() => {
  document.getElementById("line1").textContent = "Picking an experience for you... done.";
  document.getElementById("line2").style.visibility = "visible";
  document.getElementById("line2").animate(
    [{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 500, easing: "ease", fill: "forwards" }
  );
}, 900);

setTimeout(() => {
  document.getElementById("actions").style.visibility = "visible";
  const cd = document.getElementById("countdown");
  cd.style.visibility = "visible";
  cd.style.setProperty("--dur", AUTO_LAUNCH_MS + "ms");
}, 1500);

// Countdown ticker
let remaining = Math.ceil(AUTO_LAUNCH_MS / 1000);
const secs = document.getElementById("secs");
secs.textContent = remaining;
const tick = setInterval(() => {
  remaining -= 1;
  if (remaining <= 0) { clearInterval(tick); return; }
  secs.textContent = remaining;
}, 1000);

// Auto launch
let launchTimer = setTimeout(() => launch(pickedExp.slug), 1500 + AUTO_LAUNCH_MS);

function cancelAuto() {
  clearTimeout(launchTimer);
  clearInterval(tick);
  const cd = document.getElementById("countdown");
  cd.style.visibility = "hidden";
}

function launch(slug) {
  stage.classList.add("fade-out");
  setTimeout(() => { window.location.href = "../" + slug + "/"; }, 380);
}

// ---- Buttons ----
document.getElementById("goBtn").addEventListener("click", () => {
  cancelAuto();
  launch(pickedExp.slug);
});
document.getElementById("stayBtn").addEventListener("click", cancelAuto);

const dropdown = document.getElementById("dropdown");
document.getElementById("switchBtn").addEventListener("click", () => {
  cancelAuto();
  dropdown.classList.toggle("open");
  if (dropdown.innerHTML === "") buildDropdown();
});

function buildDropdown() {
  const others = EXPERIENCES.filter(e => e.slug !== pickedExp.slug);
  const rows = others.map(e => (
    `<button data-slug="${e.slug}">${e.label}<span class="slug">${e.hint}</span></button>`
  )).join("");
  const random = `<button data-slug="__random">Surprise me<span class="slug">pick one at random</span></button>`;
  const remember = `<button data-slug="__remember">Remember this pick<span class="slug">so I stop guessing</span></button>`;
  dropdown.innerHTML = rows + random + remember;
  dropdown.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const slug = btn.getAttribute("data-slug");
      if (slug === "__random") {
        const r = EXPERIENCES[Math.floor(Math.random() * EXPERIENCES.length)];
        launch(r.slug);
      } else if (slug === "__remember") {
        localStorage.setItem("jr_experience_locked", pickedExp.slug);
        btn.textContent = "Locked — launching...";
        setTimeout(() => launch(pickedExp.slug), 500);
      } else {
        launch(slug);
      }
    });
  });
}

// Keyboard: any key or Enter launches; Esc cancels auto; ? opens switch
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return cancelAuto();
  if (e.key === "?" || e.key === "/") {
    cancelAuto();
    dropdown.classList.add("open");
    if (dropdown.innerHTML === "") buildDropdown();
    e.preventDefault();
    return;
  }
  if (e.key === "Enter") {
    cancelAuto();
    launch(pickedExp.slug);
  }
});
</script>
</body>
</html>
