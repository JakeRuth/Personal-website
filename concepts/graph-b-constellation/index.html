<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jake Ruth — a star map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;500&family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="sky"></canvas>

  <!-- Title / masthead -->
  <header class="masthead">
    <div class="eyebrow">a personal star map</div>
    <h1>Jake Ruth</h1>
    <div class="sub">engineer · founder · meditator · ~13 years in orbit</div>
  </header>

  <!-- Legend / constellation picker -->
  <aside class="legend" aria-label="constellation picker">
    <div class="legend-title">constellations</div>
    <ul id="legend-list"></ul>
    <div class="legend-help">
      <div><span class="k">1–6</span> focus</div>
      <div><span class="k">0</span> reset</div>
      <div><span class="k">click</span> a star</div>
    </div>
  </aside>

  <!-- Detail panel that fades in when a star is clicked -->
  <section id="detail" class="detail" aria-live="polite">
    <div class="detail-kicker" id="detail-kicker">constellation</div>
    <h2 id="detail-title">—</h2>
    <p id="detail-body"></p>
    <div class="detail-meta" id="detail-meta"></div>
    <button class="close-btn" id="detail-close" aria-label="close">close ×</button>
  </section>

  <!-- Footer / contact -->
  <footer class="foot">
    <span>jake@stockunlock.com</span>
    <span class="dot">·</span>
    <span>next chapter loading…</span>
  </footer>

  <!-- Tooltip label that follows the hovered star -->
  <div id="hover-label" class="hover-label" role="tooltip"></div>

  <script src="app.js"></script>
</body>
</html>
